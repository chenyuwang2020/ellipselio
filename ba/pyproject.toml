[project]
name = "ellipselio-ba"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "nvidia-cuda-nvcc-cu12==12.1.105",
    "nvidia-cudss-cu12<=0.7.1.6",
    "open3d>=0.19.0",
    "pypose>=0.9.5",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "warp-lang>=1.15.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"

[tool.uv.sources]
pypose = { git = "https://github.com/pypose/pypose.git" }

[tool.pytest.ini_options]
pythonpath = ["."]
