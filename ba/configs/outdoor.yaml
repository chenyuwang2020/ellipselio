# 室外数据(街道尺度,场景 > 50 m)
#
# 用法:
#   cd ~/ws_chenyu/slam/ellipselio/src/ellipselio/ba
#   PYTHONPATH=. uv run --no-sync python -m ellipselio_ba.run --config configs/outdoor.yaml
#
# 查看所有预设的参数对照表:
#   PYTHONPATH=. uv run --no-sync python -m ellipselio_ba.run --show-presets

preset: outdoor
# ↑ 等价于下面四行(取消注释即可单独调整,写在这里会覆盖预设):
#   voxel_size: 1.0      # 体素边长(m)。墙面路面在 1 m 内仍是平的
#   huber: 0.06          # 鲁棒核(m)。约 3 倍 Mid360 远距离噪声(±2 cm)
#   outer: 8             # 外层迭代
#   map_voxel: 0.05      # 导出地图降采样(m)。室外厚度约 3 cm,取 5 cm

result_dir: /path/to/ellipselio-results-path

rebuild_map: true        # 导出 map_before.pcd / map_after.pcd 便于对比
