# 全部可用配置项及其默认值。复制一份改成自己的配置。
# 优先级: 内置默认值 < preset < 配置文件 < 命令行参数

# 场景预设: indoor(房间) / building(楼层) / outdoor(街道)
# 套用后下面任何一项都可以单独覆盖
preset: indoor

# ---- 输入输出 ----
result_dir: /path/to/ellipselio-results-path   # ellipselio 的结果保存目录 
out_dir: null                # 默认 <result_dir>/../ellipselio_ba
every: 1                     # 每 N 帧取一帧,调参时设 10 可快速试
max_frames: null             # 最多用多少帧
min_range: 0.5               # 丢弃近于此距离的点(米),去掉打到操作者的点
rebuild_map: false           # 是否导出优化前后的拼接地图
map_voxel: 0.0               # 导出地图的降采样体素(米),0 = 不降采样

# ---- 平面块构建 ----
voxel_size: 0.2              # 体素边长(米)。最关键,必须匹配场景尺度
min_points: 50               # 体素最少点数
min_frames: 5                # 体素最少覆盖帧数(单帧体素提供不了约束)
planarity: 0.1               # 平面性阈值 lambda0/lambda1,越小越严
max_thickness: 0.20          # 平面最大厚度(米),剔除树叶电线之类
max_points_per_patch: 300    # 单块最多点数,防止个别密集体素主导代价

# ---- 优化 ----
cost: point2plane            # point2plane(稀疏,快) 或 lambda_min(严格 BALM,慢)
outer: 6                     # 外层迭代次数(每轮重算平面)
inner: 12                    # 每轮 LM 步数
huber: 0.02                  # Huber 鲁棒核阈值(米),0 = 关闭
odom_weight: 3.0             # 里程计先验权重,0 = 关闭。超过 10 会冻结轨迹
device: null                 # null = 有 GPU 用 cuda,否则 cpu

# ---- 日志 ----
verbose_lm: false            # 显示 LM 每步的 loss/damping
